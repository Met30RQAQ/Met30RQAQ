<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated developer profile header</title>
  <desc id="desc">A subtle animated GitHub profile banner with moving light lines and pulsing interface nodes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101820"/>
      <stop offset="0.48" stop-color="#162A31"/>
      <stop offset="1" stop-color="#22312A"/>
    </linearGradient>

    <linearGradient id="beam" x1="-260" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#66E3FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#66E3FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 180) rotate(90) scale(180 420)">
      <stop stop-color="#74F2CE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#74F2CE" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.18">
    <path d="M0 96H1200" stroke="#F8FAFC"/>
    <path d="M0 180H1200" stroke="#F8FAFC"/>
    <path d="M0 264H1200" stroke="#F8FAFC"/>
    <path d="M180 0V360" stroke="#F8FAFC"/>
    <path d="M410 0V360" stroke="#F8FAFC"/>
    <path d="M790 0V360" stroke="#F8FAFC"/>
    <path d="M1020 0V360" stroke="#F8FAFC"/>
  </g>

  <g opacity="0.34">
    <path d="M112 250C222 112 321 109 435 186C548 263 657 282 803 151C930 38 1013 69 1095 127" stroke="#74F2CE" stroke-width="2"/>
    <path d="M89 134C251 219 344 236 482 154C609 78 723 57 842 129C957 199 1018 222 1122 185" stroke="#66E3FF" stroke-width="2"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="254" cy="164" r="6" fill="#74F2CE">
      <animate attributeName="r" values="5;10;5" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="505" cy="174" r="5" fill="#66E3FF">
      <animate attributeName="r" values="4;9;4" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="824" cy="140" r="6" fill="#FCD34D">
      <animate attributeName="r" values="5;11;5" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="965" cy="205" r="5" fill="#74F2CE">
      <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="92" y="78" width="318" height="122" rx="18" fill="#0B1220" fill-opacity="0.56" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="122" cy="108" r="6" fill="#FB7185"/>
    <circle cx="146" cy="108" r="6" fill="#FCD34D"/>
    <circle cx="170" cy="108" r="6" fill="#4ADE80"/>
    <rect x="122" y="139" width="198" height="8" rx="4" fill="#E2E8F0" opacity="0.82"/>
    <rect x="122" y="165" width="248" height="8" rx="4" fill="#74F2CE" opacity="0.68"/>
  </g>

  <g>
    <text x="470" y="143" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Code. Design. Iterate.</text>
    <text x="474" y="188" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="20">AI tools, desktop products, automation, and polished interfaces.</text>
  </g>

  <g transform="translate(0 0)">
    <rect x="-300" y="0" width="520" height="360" fill="url(#beam)" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" from="-220 0" to="1500 0" dur="5.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0.82">
    <rect x="910" y="78" width="190" height="42" rx="21" fill="#F8FAFC" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="940" cy="99" r="7" fill="#74F2CE">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="960" y="106" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Always building</text>
  </g>
</svg>
